{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Создать статью</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="header">
        <h1>Django public blog</h1>
        <a class="all-posts-link" href="{% url 'archive' %}">Все статьи</a>
    </div>
    <div class="content">
        <h1>Написать статью</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Название статьи" value="{{ form.title }}" class="form-input">
            <textarea name="text" placeholder="Текст статьи" class="form-textarea">{{ form.text }}</textarea>
            <input type="submit" value="Сохранить" class="form-submit">
        </form>
        
        {% if form.errors %}
            <p class="error">{{ form.errors }}</p>
        {% endif %}
    </div>
</body>
</html>
