{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="header">
        <h1>Django public blog</h1>
        <a class="all-posts-link" href="{% url 'archive' %}">Все статьи</a>
    </div>
    <div class="content">
        <h1>Регистрация</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Логин" value="{{ username }}" class="form-input">
            <input type="email" name="email" placeholder="Email" value="{{ email }}" class="form-input">
            <input type="password" name="password" placeholder="Пароль" class="form-input">
            <input type="submit" value="Зарегистрироваться" class="form-submit">
        </form>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </div>
</body>
</html>
